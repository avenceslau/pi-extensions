name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/clef/package-lock.json
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: npm ci
      - run: npm ci --prefix workers/clef
      - run: npm test
